<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
     initial-scale=1.0">
     <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f7f8;
        margin: 40px;
    }

    h1 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
    }

    table {
        width: 80%;
        margin: 0 auto;
        border-collapse: collapse;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        background-color: #fff;
    }

    thead {
        background-color: #007BFF;
        color: white;
    }

    th,
     td {
        padding: 12px 20px;
        text-align: left;
        border-bottom: 1px solid #ddd;
    }

    tr:hover {
        background-color: #f1f1f1;
    }

    th {
        font-size: 16px;
        letter-spacing: 0.5px;
    }

    td {
        font-size: 15px;
        color:green; /* Make Name, Role, and Salary red */
    }
</style>

    <title>Table - html</title>
</head>
<body>
    <h1>Table in html</h1>
    <table>
        <!-- head of the table -->
        <thead>
    <tr>
        <th>Name</th>
    <th>Role</th>
    <th>Salery</th>
    </tr>
        </thead>
        <!-- Body of the table -->
        <tbody>
            <tr>
                <td>Ayush singh</td>
                <td>cloud engineer</td>
                <td>$1000</td>
            </tr>
            <tr>
                <td>Yuvraj singh</td>
                <td>Software developer</td>
                <td>$900</td>
            </tr>
            <tr>
                <td>Amit singh</td>
                <td>Web Developer</td>
                <td>$700</td>
            </tr>
            <tr>
                <td>Anmol singh</td>
                <td>Accountant </td>
                <td>$800</td>
            </tr>
            <tr>
                <td>Gaurav singh</td>
                <td>Java Developer</td>
                <td>$900</td>
            </tr>
            <tr>
                <td colspan="3">Thank you</td>
            </tr> 
        </tbody>
    </table>
</body>
</html>
